version: '3.8'
services:
  db:
    image: postgres:16
    container_name: warsztat_db
    environment:
      POSTGRES_DB: webappdb
      POSTGRES_USER: appuser
      POSTGRES_PASSWORD: StrongPassword123
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data

volumes:
  db_data:
